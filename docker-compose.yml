services:
  backend:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: dev-compose-secret
      DJANGO_DEBUG: '1'
      DJANGO_ALLOWED_HOSTS: '*'
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:4173
      FINE_PER_DAY: '1.00'
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    command: sh -c "python manage.py migrate && python manage.py seed_demo && python manage.py runserver 0.0.0.0:8000"

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - '5173:5173'
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
